name: Homebrew CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Install and test every formula on macOS and Linux
        required: true
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test:
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Link checkout as pgsty/infra tap
        id: tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/pgsty/homebrew-infra"
          mkdir -p "$(dirname "$tap_path")"
          rm -rf "$tap_path"
          ln -s "$GITHUB_WORKSPACE" "$tap_path"
          brew trust pgsty/infra
          echo "name=pgsty/infra" >> "$GITHUB_OUTPUT"
          echo "path=$tap_path" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Verify tap metadata and updater
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: |
          ruby_bin="$(brew --repository)/Library/Homebrew/vendor/portable-ruby/current/bin/ruby"
          for formula_path in Formula/*.rb; do
            "$ruby_bin" -c "$formula_path"
          done
          brew style "$TAP_NAME"
          brew ruby -- test/update_formulae_test.rb
          brew ruby -- scripts/update-formulae.rb --check
          brew readall --aliases --os=all --arch=all "$TAP_NAME"
          brew audit --except=installed --tap="$TAP_NAME"

      - name: Install and test every formula
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.smoke)
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: |
          formulae=()
          for formula_path in Formula/*.rb; do
            formulae+=("$(basename "$formula_path" .rb)")
          done
          qualified=()
          for formula in "${formulae[@]}"; do
            qualified+=("$TAP_NAME/$formula")
          done
          brew install "${qualified[@]}"
          for formula in "${formulae[@]}"; do
            brew test "$TAP_NAME/$formula"
          done
