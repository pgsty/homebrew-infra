name: update formulae

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  update:
    if: github.repository == 'pgsty/infra'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew and tap
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Link checkout as pgsty/infra tap
        id: tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/pgsty/homebrew-infra"
          mkdir -p "$(dirname "$tap_path")"
          rm -rf "$tap_path"
          ln -s "$GITHUB_WORKSPACE" "$tap_path"
          brew trust pgsty/infra
          echo "name=pgsty/infra" >> "$GITHUB_OUTPUT"
          echo "path=$tap_path" >> "$GITHUB_OUTPUT"

      - name: Update release URLs and checksums
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruby_bin="$(brew --repository)/Library/Homebrew/vendor/portable-ruby/current/bin/ruby"
          "$ruby_bin" scripts/update-formulae.rb

      - name: Verify updater invariants
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: |
          ruby_bin="$(brew --repository)/Library/Homebrew/vendor/portable-ruby/current/bin/ruby"
          brew style "$TAP_NAME"
          "$ruby_bin" test/update_formulae_test.rb
          "$ruby_bin" scripts/update-formulae.rb --check
          git diff --check

      - name: Audit formulae
        env:
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: |
          for formula_path in Formula/*.rb; do
            formula_name=$(basename "$formula_path" .rb)
            brew audit --strict --online "$TAP_NAME/$formula_name"
          done
        working-directory: ${{ steps.tap.outputs.path }}

      - name: Detect changes
        id: changes
        working-directory: ${{ steps.tap.outputs.path }}
        run: |
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up git
        if: steps.changes.outputs.changed == 'true'
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Create or refresh update pull request
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/formula-updates
        run: |
          git switch -C "$UPDATE_BRANCH"
          git add Formula
          git commit -m "chore: update Homebrew formulae"
          git push --force origin "HEAD:refs/heads/$UPDATE_BRANCH"

          pull_request=$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -z "$pull_request" ]]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update Homebrew formulae" \
              --body "Automated atomic refresh of PGSTY release URLs and SHA-256 digests. The update job completed updater tests, Homebrew style checks, and strict online audits before opening this pull request."
          fi

          gh workflow run tests.yml --ref "$UPDATE_BRANCH" --field smoke=true
